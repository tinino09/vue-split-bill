<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行銷學選擇題練習</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--bd:#dcdad3;--ac:#2f5fd0;--acbg:#e6edfb;--ok:#1f8a4c;--okbg:#e2f4e9;--no:#c23a2b;--nobg:#fbe7e4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171716;--card:#232321;--tx:#ecebe6;--mut:#a09f98;--bd:#3a3a37;--ac:#7fa1f5;--acbg:#26314d;--ok:#5fd08e;--okbg:#1d3a29;--no:#f08a7d;--nobg:#432522}}
:root[data-theme=dark]{--bg:#171716;--card:#232321;--tx:#ecebe6;--mut:#a09f98;--bd:#3a3a37;--ac:#7fa1f5;--acbg:#26314d;--ok:#5fd08e;--okbg:#1d3a29;--no:#f08a7d;--nobg:#432522}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 16px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.pri:disabled{opacity:.4;cursor:default}
.menu button{display:block;width:100%;text-align:left;margin:10px 0}
.menu b{display:block}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top button{padding:6px 12px;font-size:14px}
.q{font-size:17px;font-weight:600;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:12px}
.opt .l{flex:none;width:24px;font-weight:700;color:var(--mut)}
.opt.sel{border-color:var(--ac);background:var(--acbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.fb{margin:10px 0;font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}
.score{font-size:48px;font-weight:700;text-align:center;margin:4px 0}
.rv{border-left:4px solid var(--bd);padding-left:12px;margin:14px 0;font-size:15px}
.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--no)}
</style></head><body><main id="app"></main>
<script>
const Q=[{"id": 1, "q": "Dividing a market into several sections of customers is known as", "o": ["market segmentation", "value engineering", "undifferentiated marketing", "market positioning", "mass customization"], "a": 0}, {"id": 2, "q": "________ are customers who show low potential profitability and little projected loyalty.", "o": ["Butterflies", "Strangers", "True friends", "Barnacles", "True believers"], "a": 1}, {"id": 3, "q": "Which of these questions must be answered to develop a winning marketing strategy?", "o": ["Which online platform should we use to market our products?", "How do we deliver products to customers?", "What is our value proposition?", "What products should we focus on selling?", "How many marketing representatives will we need to hire?"], "a": 2}, {"id": 4, "q": "The ________ concept holds that achieving organizational goals depends on knowing the needs and wants of target markets and delivering the desired satisfactions better than competitors do.", "o": ["production", "selling", "marketing", "societal marketing", "product"], "a": 2}, {"id": 5, "q": "Stew Leonard's has created what has been called the \"Disneyland of Dairy Stores,\" complete with costumed characters, scheduled entertainment, and a petting zoo. It's built 30 additions onto the original store, which now serves more than 300,000 customers each week. This legion of loyal shoppers is largely a result of the store's passionate approach to customer service. Instead of focusing on individual transactions, Stew and his staff are putting a priority on", "o": ["converting \"strangers\" into \"butterflies\"", "attracting \"butterflies\"", "decreasing customer-perceived value", "managing partner relationships", "capturing customer lifetime value"], "a": 4}, {"id": 6, "q": "The use of social media, mobile ads and apps, online video, blogs and other digital platforms to connect with and engage consumers via their digital devices is known as", "o": ["sustainability marketing.", "real-time marketing.", "online engagement.", "the Internet of Things.", "digital and social media marketing."], "a": 4}, {"id": 7, "q": "________ is the total combined customer lifetime values of all the company's current and potential customers.", "o": ["Market share", "Value proposition", "Customer equity", "Customer-perceived value", "Share of customer"], "a": 2}, {"id": 8, "q": "PC manufacturer, Lenovo, focuses on low labor costs and mass distribution to ensure the continuous availability of its products at reasonable prices. Lenovo most likely follows the", "o": ["production concept", "societal marketing concept", "selling concept", "customer-driving marketing concept", "marketing concept"], "a": 0}, {"id": 9, "q": "A customer who is both loyal and profitable is referred to as a", "o": ["barnacle", "butterfly", "stranger", "laggard", "true believer"], "a": 4}, {"id": 10, "q": "Dollar General profitably appeals to families with more modest means. The retailer's approach is most likely referred to as", "o": ["mass distribution", "target marketing", "undifferentiated marketing", "consumer-generated marketing", "cost leadership"], "a": 1}, {"id": 11, "q": "Which of the following is an example of consumer-generated marketing?", "o": ["Fun & Run, a local amusement park, promotes its services by allowing consumers to upload videos and write reviews about the park.", "Cristal, a jewelry store, uses its page on Facebook to provide information about its upcoming products to its customers.", "Barton's, a local pet supply store, rewards frequent buyers with vouchers and exclusive offers.", "Energix, a manufacturer of soft drinks, attracts customers through televised advertisements.", "Figa, a leading provider of athletic shoes, helps its customers customize their shoes on its website and choose personalized settings."], "a": 0}, {"id": 12, "q": "The Walt Disney World Resort doesn't just offer amusement park rides, it uses its famed Disney magic to create carefully orchestrated", "o": ["benefits", "experiences", "service offerings", "values", "wants"], "a": 1}, {"id": 13, "q": "Procter & Gamble's Tide detergent does not attempt to get to know customers personally. Instead, Tide creates engagement and relationships through brand-building advertising, websites, and social media presence. Which of the following types of associations would be most profitable for the firm to develop with these customers?", "o": ["joint ventures", "strategic alliances", "business partnering", "full partnerships", "basic relationships"], "a": 4}, {"id": 14, "q": "________ companies research customers deeply to learn about their desires, gather new product ideas, and test product improvements.", "o": ["Customer-driving", "Functional", "Production-oriented", "Customer-driven", "Societal"], "a": 3}, {"id": 15, "q": "Which of the following transforms marketing strategies into real values for consumers?", "o": ["a firm's value proposition", "customer satisfaction surveys", "customer equity", "share of customer", "the four Ps of marketing"], "a": 4}, {"id": 16, "q": "The ABC, a leading provider of personal computer systems, began manufacturing tablet devices after predicting a future consumer need for portability. Which of the following was most likely implemented by the ABC company?", "o": ["customer-driving marketing", "the selling concept", "the production concept", "sustainable marketing", "the product concept"], "a": 0}, {"id": 17, "q": "Some firms, such as Ben & Jerry's and Unilever, focus on setting themselves apart by being civic minded and socially responsible. These firms are practicing", "o": ["caring capitalism", "socialism", "global marketing", "digital marketing", "financial sustainability"], "a": 0}, {"id": 18, "q": "Which of the following terms refers to a customer's evaluation of the difference between all the benefits and all the costs of a market offering relative to those of competing offers?", "o": ["customer equity", "customer profitability", "customer-perceived value", "share of customer", "customer lifetime value"], "a": 2}, {"id": 19, "q": "Which of these questions is answered by a firm's value proposition?", "o": ["How will I inform my target audience about my products?", "Why should I buy your brand rather than a competitor's?", "Should I use more digital marketing tools or traditional tools?", "What products should I deliver?", "Which markets do I serve?"], "a": 1}, {"id": 20, "q": "________ are the form human needs take as they are shaped by culture and individual personality.", "o": ["Services", "Necessities", "Risks", "Wants", "Benefits"], "a": 3}, {"id": 21, "q": "Many leading business and marketing thinkers are now preaching the concept of \"shared value\" which recognizes that ________ needs, not just economic needs, define markets.", "o": ["individual", "physical", "marketing", "functional", "societal"], "a": 4}, {"id": 22, "q": "A brand's ________ is the set of benefits that it promises to deliver to consumers to satisfy their needs.", "o": ["value proposition", "fringe benefit", "perquisite", "dominant effect", "dividend yield"], "a": 0}, {"id": 23, "q": "Customer-driven marketing is most effective when", "o": ["customers seek new products and technological innovations", "a clear need exists among customers, but the need is difficult to identify", "clear needs exist and customers know what they want", "customers have wants but cannot afford them", "customers do not know what they want but are easily persuaded"], "a": 2}, {"id": 24, "q": "In which of the following circumstances is an organization likely to engage in full partnerships with key consumers?", "o": ["when the market has few customers and high margins", "when the market has a huge number of customers", "when the firm has a large number of low-margin customers", "when the firm has few marketing resources at its disposal", "when the firm has a frequency marketing program"], "a": 0}, {"id": 25, "q": "________ refers to working closely with people inside and outside the company to jointly bring more value to customers.", "o": ["Demand management", "Customer-generated marketing", "Partner relationship management", "Channel value proposition", "Integrated communication"], "a": 2}, {"id": 26, "q": "The selling concept holds that", "o": ["consumers will favor products that offer the most in quality, performance, and innovative features", "consumers will only favor products that are available and highly affordable", "consumers will not buy enough of a firm's products unless the firm undertakes large-scale persuasion and promotion efforts", "achieving organizational goals depends on knowing the needs and wants of target markets and delivering the desired satisfactions better than competitors do", "a company's marketing decisions should consider consumers' wants, the company's requirements, consumers' long-run interests, and society's long-run interests"], "a": 2}, {"id": 27, "q": "According to the five-step model of the marketing process, the final step in marketing is", "o": ["designing a customer-driven marketing strategy", "engaging customers, building profitable relationships, and creating customer delight", "understanding the marketplace and customer needs and wants", "capturing value from customers to create profits and customer equity", "constructing an integrated marketing program that delivers superior value"], "a": 3}, {"id": 28, "q": "According to the five-step model of the marketing process, the first step in marketing is", "o": ["understanding the marketplace and customer needs and wants", "constructing an integrated marketing program that delivers superior value", "engaging customers, building profitable relationships, and creating customer delight", "capturing value from customers to create profits and customer equity", "designing a customer-driven marketing strategy"], "a": 0}, {"id": 29, "q": "To market the cause of suicide prevention, rapper Logic worked with the National Suicide Prevent Lifeline (NSPL) to create a video embedded with his song \"1-800-273-8255,\" the NSPL phone number. This is an example of a marketing offering for a(n)", "o": ["person", "exchange", "product", "idea", "place"], "a": 3}, {"id": 30, "q": "Carla, a team leader in charge of customer relationship management, is planning strategies to improve the profitability of her firm's least profitable but loyal customers. She is also examining methods for \"firing\" customers in this group who cannot be made profitable. To which of the following customer relationship groups do these customers belong?", "o": ["strangers", "innovators", "butterflies", "true friends", "barnacles"], "a": 4}, {"id": 31, "q": "Demetrius scheduled a Zoom meeting with the engineering, production, and finance departments to discuss a new product idea that originated from the marketing department. These internal departments are part of the firm's", "o": ["value chain", "marketing chain", "finance function", "supply chain", "delivery chain"], "a": 0}, {"id": 32, "q": "Which of the following is true of strategic planning in a firm?", "o": ["It occurs at the business-unit, product, and market levels rather than at the corporate level.", "It focuses on the firm's internal environment rather than the external environment.", "It deals with adapting the firm to take advantage of changing marketing opportunities.", "It deals with maintaining the company's current business ventures.", "It involves preparing short-term investment objectives at the product level."], "a": 2}, {"id": 33, "q": "Both product development strategies and diversification strategies involve", "o": ["leaving the current market", "selling in new as well as existing markets", "developing a new product", "selling a company's current products", "selling in a company's current market"], "a": 2}, {"id": 34, "q": "ToyBox is a toy manufacturer based in the United Kingdom. Which of the following indicates that the company is following a market penetration strategy?", "o": ["It introduces its toys in the Indian and Southeast Asian markets.", "It develops a new line of educational software targeted at the current market.", "It acquires toy rights for a popular cartoon character to boost its sales.", "It introduces a line of children's clothing in the United Kingdom.", "It enters the U.S. market with a line of children's clothing."], "a": 2}, {"id": 35, "q": "When viewing the market from a buyer's point of view, \"communication\" corresponds to the ________ component of the marketing mix.", "o": ["place", "promotion", "product", "people", "price"], "a": 1}, {"id": 36, "q": "Vertigo is an electronics company. According to the BCG matrix, which of the following products of Vertigo would most likely classify as a question mark?", "o": ["SoLo-a CD player that has a very low market share in a market that is shrinking rapidly", "Electra-a home entertainment system that has a strong market share in a market that is likely to expand in the future", "Blue-a cell phone that is designed for music lovers and has a very low market share in a market that is growing steadily", "Kindle Fire-a children's iPad that has a high market share in a market that is not expected to grow significantly", "SpinDrive-a car audio system that has a high market share in a market that has been growing constantly"], "a": 2}, {"id": 37, "q": "Marcos is considering business expansion and buying a local business that provides cleanup and sanitation services for local businesses. In his current business he owns 10 food trucks that serve the greater metropolitan area. If he does buy the sanitation business it would be an example of growing his business through", "o": ["market penetration", "diversification", "market development", "adaptation", "product development"], "a": 1}, {"id": 38, "q": "A strategy for company growth that involves increasing sales to current market segments without changing the product is known as", "o": ["diversification", "product development", "market differentiation", "market development", "market penetration"], "a": 4}, {"id": 39, "q": "Which of these macroenvironment forces would be most likely to drive a company to be more environmentally conscious?", "o": ["cultural", "technological", "natural", "economic", "demographic"], "a": 2}, {"id": 40, "q": "Which of the following is a true statement about Baby Boomers?", "o": ["They are the first generation to have grown up with computers.", "They constitute the largest demographic group in the United States.", "They are the wealthiest generation in U.S. history.", "They are the most educated generation of Americans.", "They were born between 1965 and 1976."], "a": 2}, {"id": 41, "q": "Nike's goal to increase sales of its running shoes by 25 percent during the first six months of the new fiscal year is an example of a", "o": ["marketing strategy", "positioning objective", "marketing objective", "target market strategy", "differentiation objective"], "a": 2}, {"id": 42, "q": "The first step in the BCG approach is to", "o": ["invest funds in stars", "define your marketing mix", "milk the cash cows", "divest the dogs", "identify the firm's strategic business units (SBUs)"], "a": 4}, {"id": 43, "q": "________ refers to reducing the business portfolio by abandoning products that no longer fit the company's overall strategy.", "o": ["Downsizing", "Product line extension", "Market segmentation", "Diversification", "Vertical integration"], "a": 0}, {"id": 44, "q": "The overall process of building and maintaining profitable customer relationships by delivering superior customer value and satisfaction is referred to as", "o": ["partner relationship management", "enterprise resource planning", "societal marketing", "perceived-value management", "customer relationship management"], "a": 4}, {"id": 45, "q": "JetBlue's promise that \"Just Alright Doesn't Fly Here\" and their commitment to deliver \"award-winning service from award-winningly nice humans\" is their", "o": ["value proposition", "production concept", "market offering", "selling concept", "segmentation strategy"], "a": 0}, {"id": 46, "q": "________ are defined as states of felt deprivation.", "o": ["Needs", "Values", "Ideas", "Exchanges", "Demands"], "a": 0}, {"id": 47, "q": "Which of the following concepts calls for sustainable marketing?", "o": ["the marketing concept", "the societal marketing concept", "the production concept", "the product concept", "the selling concept"], "a": 1}, {"id": 48, "q": "________ refers to the portion of the customer's purchase that a company gets in its product categories.", "o": ["Customer lifetime value", "Customer equity", "Value proposition", "Brand equity", "Share of customer"], "a": 4}, {"id": 49, "q": "Which of these is an example of real-time marketing?", "o": ["Starbucks collecting customer data on their website", "Procter & Gamble using coupons in the Sunday paper", "Elon Musk tweeting about cryptocurrency", "Taco Bell using navigation apps with directions to nearby stores", "Best Buy making it easy to return unwanted items"], "a": 3}, {"id": 50, "q": "In a SWOT analysis, ________ refer to unfavorable external factors or trends that may present challenges to performance.", "o": ["opportunities", "weaknesses", "strategies", "threats", "strengths"], "a": 3}, {"id": 51, "q": "According to the BCG matrix, products or businesses with a high market share in a high-growth market are classified as", "o": ["dogs", "stars", "cash cows", "heroes", "question marks"], "a": 1}, {"id": 52, "q": "Both market penetration and market development strategies primarily involve", "o": ["selling the company's current products", "leaving the current market", "selling in new as well as existing markets", "developing new products", "modifying the company's product line"], "a": 0}, {"id": 53, "q": "From a marketing perspective, a firm's success depends not only on how well each department performs it's work but also on how well these departments", "o": ["coordinate their activities", "advertise their successes", "utilize their budgets", "implement cost cutting strategies", "isolate to do their jobs"], "a": 0}, {"id": 54, "q": "Packaging is an element of the ________ component of a company's marketing mix.", "o": ["price", "product", "promotion", "people", "place"], "a": 1}, {"id": 55, "q": "Demographic, economic, natural, technological, political, and cultural forces form the ________ of an organization.", "o": ["microenvironment", "supply chain", "marketing intermediary network", "internal environment", "macroenvironment"], "a": 4}, {"id": 56, "q": "Reseller markets consist of", "o": ["firms that buy goods and services to sell at a profit", "individuals who buy goods and services for personal consumption", "firms that buy goods and services for further processing", "government agencies that buy goods and services to produce public services", "firms that buy goods and services to assemble overseas"], "a": 0}, {"id": 57, "q": "The boom in online, mobile, and social media has created a new set of social and ethical issues for companies. Their greatest concern involves", "o": ["protecting the privacy of knowing and unknowing customers", "rarely following the marketing orientation when devising promotional offers online", "providing too many alternative products online which confuses customers", "failing to reach their target customers through online marketing", "failure to provide value-priced products for online customers"], "a": 0}, {"id": 58, "q": "P&G's Tide Loads of Hope program provides mobile laundromats and loads of clean laundry to families in disaster-stricken areas. This is an example of ________ marketing.", "o": ["environmental", "charitable", "ethical", "cause-related", "social"], "a": 3}, {"id": 59, "q": "BlueBear is a shoe manufacturer based in the United States. Which of the following indicates that the company is following a market development strategy?", "o": ["BlueBear employs a British comedian for a U.S. advertising campaign.", "BlueBear develops a line of athletic shoes for its current target market.", "BlueBear adds a line of leather purses to its offerings in the U.S. market.", "BlueBear introduces a line of children's clothing to its current target market.", "BlueBear introduces its shoes in the Indian and Southeast Asian markets."], "a": 4}, {"id": 60, "q": "Which of the following will most likely be included in the \"price\" component of a company's marketing mix?", "o": ["brand name", "inventory", "packaging", "sales promotion", "discounts"], "a": 4}, {"id": 61, "q": "Evaluating the results of marketing strategies and plans and taking corrective action to ensure that the objectives are attained is called", "o": ["marketing implementation", "marketing control", "market targeting", "market planning", "marketing development"], "a": 1}, {"id": 62, "q": "Which of the following best describes a marketing department with a functional organization?", "o": ["Marketing managers are responsible for developing marketing strategies and plans for their specific markets or customers, and the company is organized around the needs of specific customer segments.", "A company creates large teams, or even whole divisions, to serve domestic and international markets.", "Different marketing activities are headed by specialists such as sales managers, advertising managers, marketing research managers, and customer service managers.", "A product manager develops and implements a complete strategy and marketing program for a specific product or brand.", "Sales and marketing people are assigned to specific countries, regions, and districts."], "a": 2}, {"id": 63, "q": "Which component of the marketing mix refers to the goods-and-services combination a company offers to its target market?", "o": ["position", "place", "product", "price", "promotion"], "a": 2}, {"id": 64, "q": "Which of the following companies is using a divesting strategy?", "o": ["Harlow's market share remains steady over two years, and the firm decides to maintain its share at the current level.", "Juggernaut Bikes acquires new businesses in order to increase its market share.", "To achieve a higher market share, LBD Inc. increases investments in advertising and promotion.", "Getix Computers increases the price of its products in order to maximize short-term profits.", "When sales of its clothing division decline, Blackstone sells the division to a competitor."], "a": 4}, {"id": 65, "q": "Recyclable or biodegradable packaging, recycled materials and components, and better pollution controls are ways that marketers have responded to the", "o": ["new recycling laws", "new government intervention program", "environmental sustainability movement", "pollution reduction movement", "increased need to comply with environmental regulations"], "a": 2}, {"id": 66, "q": "The responsibility for setting a company's mission, objectives, broad strategies, and policies primarily lies with its", "o": ["top management", "human resource managers", "research department", "marketing managers", "finance department"], "a": 0}, {"id": 67, "q": "________ refers to the process of evaluating each market segment's attractiveness and selecting one or more segments to enter.", "o": ["Market divesting", "Market targeting", "Market diversification", "Market positioning", "Market mixing"], "a": 1}, {"id": 68, "q": "Which of the following is an example of a local public?", "o": ["a company director who is working to improve the organization's public image", "a community organization that addresses welfare issues in its neighborhood", "a bank that helps a company acquire loans", "a federal regulatory agency that monitors business practices", "a supplier responsible for sourcing most of the raw materials used in production"], "a": 1}, {"id": 69, "q": "Which of the following are examples of internal publics of a company?", "o": ["governmental departments and agencies that regulate businesses", "neighborhood residents and community organizations", "the general public that is directly affected by the company", "newspapers, magazines, television stations, blogs, and other Internet media", "the managers, board of directors, and workers of the company"], "a": 4}, {"id": 70, "q": "A marketing intermediary would most likely help a firm by", "o": ["providing technical expertise on the production and design of goods", "moving the firm's goods from production points to distribution centers", "supplying the raw materials needed for manufacturing the firm's products", "negotiating with labor unions regarding wages, hours, and benefits", "competing directly with the firm in a certain product category"], "a": 1}, {"id": 71, "q": "________ marketing is defined as socially and environmentally responsible marketing that meets the present needs of consumers and businesses while also preserving or enhancing the ability of future generations to meet their needs.", "o": ["Sustainable", "Mass", "Ambush", "Customer-driven", "Customer-driving"], "a": 0}, {"id": 72, "q": "Abel now has the buying power to purchase the computer that he wanted to buy six months ago. Abel's want has most likely become a", "o": ["value", "desire", "need", "market offering", "demand"], "a": 4}, {"id": 73, "q": "Marketing, more than any other business function, deals with", "o": ["sales", "brands", "new products", "customers", "advertising"], "a": 3}, {"id": 74, "q": "The ultimate aim of customer relationship management is to", "o": ["turn \"strangers\" into \"butterflies\"", "evaluate current sales share", "produce high customer equity", "divide markets into distinct segments", "evaluate customer lifetime value"], "a": 2}, {"id": 75, "q": "________ is the art and science of choosing target markets and building profitable relationships with those markets.", "o": ["Marketing management", "Differentiation", "Segmentation", "Customer-perceived value", "Positioning"], "a": 0}, {"id": 76, "q": "The societal marketing concept holds that", "o": ["achieving organizational goals depends on knowing the needs and wants of target markets and delivering the desired satisfactions better than competitors do", "consumers will favor products that offer the most in quality, performance, and innovative features", "a company's marketing decisions should focus on creating economic value in a way that also creates value for the surrounding environment", "the society will only favor products that are available and highly affordable", "consumers will not buy enough of a firm's products unless the firm undertakes a large-scale selling and promotion effort"], "a": 2}, {"id": 77, "q": "Which of the following best describes a company's business portfolio?", "o": ["the target segments of the company's various businesses", "the list of all the marketing activities in which the company invests", "the company's products or services in a particular market", "the collection of businesses and products that make up the company", "the company's strengths in terms of technology, people, and products"], "a": 3}, {"id": 78, "q": "Cosmetics firm SatinSilk is revamping its mission statement and advertising strategy. The CEO stresses that the new mission statement should be market-oriented rather than product-oriented. Which of the following mission statements will best suit the company?", "o": ["to sell hypoallergenic cosmetics products made only from the finest organic ingredients", "to create the best possible products and sell them at the best possible prices", "to increase our market share in the cosmetics segment and increase profit margins", "to become a market leader in every cosmetics product category", "to give customers the complexion they dream about by providing products suited to their needs"], "a": 4}, {"id": 79, "q": "The process that turns marketing plans into marketing actions to accomplish strategic marketing objectives is called marketing", "o": ["control", "analysis", "design", "implementation", "planning"], "a": 3}, {"id": 80, "q": "Which of these might be a reason for a firm to downsize?", "o": ["The high profits will quickly attract competition.", "The firm has grown too fast.", "The BCG matrix classified the SBU incorrectly.", "The products are selling too quickly.", "The product line should not be extended."], "a": 1}, {"id": 81, "q": "Jim's Hardware relies on its ________ which is a series of internal departments that carry out value-creating activities to design, produce, market, deliver, and support a firm's products.", "o": ["internal value chain", "internal supply chain", "distributor chain", "supplier networks", "portfolio network"], "a": 0}, {"id": 82, "q": "Which of the following best describes the value chain of a company?", "o": ["the series of departments that design, produce, market, deliver, and support the company's products", "the collection of businesses and products that make up the company", "a network made up of the company, its suppliers, and its distributors working together to deliver customer value", "profits earned by the cash cows and stars in the company's business portfolio", "touchpoints at which a company or brand interacts with its consumers"], "a": 0}, {"id": 83, "q": "The two dimensions the BCG approach uses to evaluate and manage SBUs are", "o": ["market growth rate and market penetration", "market growth rate and market development", "relative market share and market penetration", "market growth rate and relative market share", "relative market share and product development"], "a": 3}, {"id": 84, "q": "Which of the following best describes positioning?", "o": ["dividing a market into distinct groups of buyers who have different needs, characteristics, or behaviors", "differentiating a market offering to create superior customer value", "evaluating each market segment's attractiveness and selecting one or more segments to enter", "arranging for a product to occupy a clear, distinctive, and desirable place relative to competing products", "identifying consumer needs and creating a product to meet those needs"], "a": 3}, {"id": 85, "q": "The citizen-action publics in a company's marketing environment include", "o": ["environmental groups", "government trade agencies", "stockholders and investment analysts", "employees and managers of the company", "news channels"], "a": 0}, {"id": 86, "q": "Which of the following is most likely categorized as a business market?", "o": ["retail outlets that buy goods and services to sell at discounted prices", "firms that buy goods and services for further processing", "individuals who buy goods and services for personal consumption", "government agencies that buy goods and services to produce public services", "firms that buy goods and services to resell for profit"], "a": 1}, {"id": 87, "q": "Which government agency is in charge of ensuring that new products are safe for consumers?", "o": ["The Food and Drug Administration", "The Federal Reserve", "The Consumer Product Safety Commission", "The U.S. Product Safety Agency", "The Bureau of Consumer Protection"], "a": 2}, {"id": 88, "q": "The ________ environment is perhaps the most dramatic force shaping the destiny of individuals and offering exciting opportunities for marketers.", "o": ["social", "cultural", "technological", "demographic", "political"], "a": 2}, {"id": 89, "q": "When a company chooses to harvest a particular strategic business unit, it", "o": ["invests just enough in the strategic business unit to keep its market share at the current level", "increases short-term cash flow despite the long-term effect", "invests more in the strategic business unit to build its market share", "gradually increases investment in the strategic business unit over time to maximize profits", "increases the advertising budget for that strategic business unit"], "a": 1}, {"id": 90, "q": "A firm's decision to identify and develop new markets for existing products is a ________ strategy.", "o": ["market penetration", "diversification", "product development", "market development", "market differentiation"], "a": 3}, {"id": 91, "q": "Which of the following is true of marketing ROI?", "o": ["Marketing ROI cannot be assessed in terms of standard marketing performance measures, such as brand awareness, sales, or market share.", "Marketing ROI measures the profits generated by investments in marketing activities.", "Marketing ROI uses only those marketing factors that can be measured in dollars.", "Marketing ROI is easier to calculate than financial ROI.", "Marketing ROI ignores customer-centered measures of marketing impact, such as customer acquisition and retention."], "a": 1}, {"id": 92, "q": "In the BCG growth-share matrix, question marks refer to products or businesses with a", "o": ["high market share in a market with a high growth rate", "low market share in a market that is set to shrink significantly", "greater market share than all their competitors combined in a saturated market", "low market share in a niche market", "low market share in a market with high growth prospects"], "a": 4}, {"id": 93, "q": "The ABC Company manufactures microprocessors and caters exclusively to private manufacturers that produce high-end computers. Which type of market does ABC directly target?", "o": ["consumer market", "government market", "retail market", "reseller market", "business market"], "a": 4}, {"id": 94, "q": "Which of the following is most likely a characteristic of firms that adopt a reactive approach toward the marketing environment?", "o": ["They passively accept the marketing environment and do not try to change it.", "They take aggressive actions to affect the marketing environment.", "They develop strategies to change the marketing environment.", "They view the marketing environment as a controllable element.", "They do not accept the marketing environment as it is."], "a": 0}, {"id": 95, "q": "Which of the following has the primary function of helping a company target and promote its products to the right markets?", "o": ["credit companies", "physical distribution firms", "service providers", "resale marketers", "marketing services agencies"], "a": 4}, {"id": 96, "q": "Ursa Martin, a book publisher, has decided to work with Hope in Children, a charity foundation that helps feed and educate children in poor countries. Ursa Martin has decided that a percentage of revenue from every book it sells will go to the charity. The books are marketed by conveying this message to customers. Which of the following marketing techniques describes Ursa Martin's association with Hope in Children?", "o": ["joint venture marketing", "green marketing", "niche marketing", "cause-related marketing", "test marketing"], "a": 3}, {"id": 97, "q": "Changes in variables, such as income, cost of living, interest rates, and savings and borrowing patterns most likely reflect changes in the ________ environment of a company.", "o": ["natural", "demographic", "economic", "political", "cultural"], "a": 2}, {"id": 98, "q": "Which of the following represents a change in the technological environment of a marketing firm?", "o": ["increased use of value marketing techniques and promotions", "increased need to engage in mass marketing over market segmentation", "increased need to comply with environmental regulations", "increased use of RFID systems to track products", "increased use of cause-related marketing"], "a": 3}, {"id": 99, "q": "A consumer advocacy group challenges a firm's decision to build a new warehouse in a small community. The advocacy group is an example of a ________ public.", "o": ["local", "media", "financial", "government", "citizen-action"], "a": 4}, {"id": 100, "q": "Disruption in the marketing environment", "o": ["appears to have accelerated in the past few years", "first appeared due to the Covid-19 pandemic", "has little impact on product mix or delivery", "has little impact on most firms", "did not affect firms until the year 2000"], "a": 0}];
const app=document.getElementById('app');
const L='ABCDE';
let S={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function home(){
  S={};
  app.innerHTML=`<h1>行銷學選擇題練習</h1><div class="mut">題庫共 ${Q.length} 題</div>
  <div class="card menu"><h2>練習模式（每題提交後立即顯示答案）</h2>
  <button onclick="start('seq')"><b>1　按順序排列</b><span class="mut">從第 1 題依序練習到第 ${Q.length} 題</span></button>
  <button onclick="start('rand')"><b>2　隨機排列</b><span class="mut">全部題目打亂順序</span></button></div>
  <div class="card menu"><h2>考核模式</h2>
  <button onclick="start('exam')"><b>隨機抽 30 題考核</b><span class="mut">全部作答完才公布解答並評分</span></button></div>`;
}
function start(m){
  const list=m==='seq'?Q.slice():m==='rand'?shuffle(Q):shuffle(Q).slice(0,30);
  S={m,list,i:0,ans:list.map(()=>null),done:list.map(()=>false)};
  draw();
}
function draw(){
  const {m,list,i,ans,done}=S,q=list[i],exam=m==='exam';
  const checked=!exam&&done[i];
  const opts=q.o.map((t,k)=>{
    let c='opt';
    if(checked){if(k===q.a)c+=' ok';else if(k===ans[i])c+=' no'}
    else if(ans[i]===k)c+=' sel';
    return `<button class="${c}" ${checked?'disabled':''} onclick="pick(${k})"><span class="l">${L[k]}</span><span>${esc(t)}</span></button>`}).join('');
  let fb='';
  if(checked)fb=ans[i]===q.a?`<div class="fb ok">✓ 答對了！</div>`:`<div class="fb no">✗ 答錯了，正確答案是 ${L[q.a]}</div>`;
  const last=i===list.length-1;
  let btns;
  if(exam){
    btns=`<button ${i?'':'disabled'} onclick="go(-1)">上一題</button>`+(last?`<button class="pri" onclick="submitExam()">交卷</button>`:`<button class="pri" onclick="go(1)">下一題</button>`);
  }else if(!done[i]){
    btns=`<button class="pri" ${ans[i]===null?'disabled':''} onclick="check()">提交答案</button>`;
  }else{
    btns=`<button class="pri" onclick="${last?'result()':'go(1)'}">${last?'查看成績':'下一題'}</button>`;
  }
  const n=exam?ans.filter(x=>x!==null).length:i+(done[i]?1:0);
  app.innerHTML=`<div class="top"><span class="mut">${exam?'考核':'練習'} · 第 ${i+1} / ${list.length} 題${exam?`（已作答 ${n}）`:''}</span><button onclick="if(confirm('確定離開並回到首頁？'))home()">首頁</button></div>
  <div class="bar"><i style="width:${(i+1)/list.length*100}%"></i></div>
  <div class="card"><div class="mut">題庫第 ${q.id} 題</div><div class="q">${esc(q.q)}</div>${opts}${fb}</div>
  <div class="row">${btns}</div>`;
  window.scrollTo(0,0);
}
function pick(k){S.ans[S.i]=k;draw()}
function check(){S.done[S.i]=true;draw()}
function go(d){S.i+=d;draw()}
function submitExam(){
  const un=S.ans.filter(x=>x===null).length;
  if(un&&!confirm(`還有 ${un} 題未作答，確定要交卷嗎？`))return;
  result();
}
function result(){
  const {m,list,ans}=S,exam=m==='exam';
  const right=list.filter((q,k)=>ans[k]===q.a).length,tot=list.length;
  const pct=Math.round(right/tot*100);
  const rv=list.map((q,k)=>{
    const ok=ans[k]===q.a;
    return `<div class="rv ${ok?'ok':'no'}"><div class="mut">${k+1}. ${ok?'✓ 答對':'✗ 答錯'}（題庫第 ${q.id} 題）</div><div>${esc(q.q)}</div>
    <div>你的答案：${ans[k]===null?'未作答':L[ans[k]]+') '+esc(q.o[ans[k]])}</div>${ok?'':`<div style="color:var(--ok)">正確答案：${L[q.a]}) ${esc(q.o[q.a])}</div>`}</div>`}).join('');
  app.innerHTML=`<h1>${exam?'考核結果':'練習完成'}</h1>
  <div class="card"><div class="score" style="color:var(${pct>=60?'--ok':'--no'})">${pct} 分</div>
  <div class="mut" style="text-align:center">答對 ${right} / ${tot} 題${exam?(pct>=60?' · 及格':' · 未及格'):''}</div></div>
  <div class="row"><button class="pri" onclick="home()">回首頁</button>${exam?'<button onclick="start(\'exam\')">再考一次</button>':''}</div>
  <div class="card"><h2>${exam?'解答與檢討':'作答回顧'}</h2>${rv}</div>`;
  window.scrollTo(0,0);
}
home();
</script></body></html>
